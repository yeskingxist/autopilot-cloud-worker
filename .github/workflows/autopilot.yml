name: AutoPilot 24-7 Cloud Traffic

on:
  schedule:
    # Runs every 30 minutes, 24/7 round the clock
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      loops:
        description: 'Number of loops for this run'
        required: false
        default: '25'
  push:
    branches:
      - main

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AutoPilot Deep Scroll Engine
        env:
          TARGET_URL: "https://zerotoherostoriess.blogspot.com/2026/11/from-five-hour-bus-rides-to-egyptian.html"
          LOOPS_PER_RUN: ${{ github.event.inputs.loops || '25' }}
          MIN_DWELL: "15"
          MAX_DWELL: "30"
        run: |
          python cloud_runner.py
