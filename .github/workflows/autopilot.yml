name: AutoPilot 24-7 Cloud Traffic

on:
  schedule:
    # Har 30 minute me cloud par apne aap chalega
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-automation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AutoPilot Deep Scroll Engine
        env:
          LOOPS_PER_RUN: "25"
          MIN_DWELL: "15"
          MAX_DWELL: "30"
        run: |
          python cloud_runner.py
